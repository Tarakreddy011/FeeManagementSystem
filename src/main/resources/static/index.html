<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203d31">
  <title>PayMyFee API</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#24342c;background:#f4f6f1;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);background:#fff;border:1px solid #dfe6dc;border-radius:8px;padding:32px;box-shadow:0 12px 32px #1c33200d}
    .mark{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;background:#d8e86a;color:#203d31;font-weight:800}
    h1{font-size:25px;margin:18px 0 8px}p{color:#66746a;line-height:1.6;margin:0 0 22px}
    nav{display:flex;gap:12px;flex-wrap:wrap}a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border-radius:5px;background:#226b50;color:white;text-decoration:none;font-weight:650;font-size:14px}
    a.secondary{border:1px solid #dce4d9;background:#fff;color:#35443a}small{display:block;color:#879188;margin-top:24px;font-size:12px}
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">₹</span>
    <h1>PayMyFee backend</h1>
    <p>The full application interface is maintained in the separate React frontend. This small page is a local fallback; backend API routes remain available to authorized clients.</p>
    <nav aria-label="Fallback links">
      <a href="http://localhost:5173">Open React frontend</a>
      <a class="secondary" href="/api-status.html">Check API status</a>
    </nav>
    <small>Spring Boot API · Local default: http://localhost:8080</small>
  </main>
</body>
</html>

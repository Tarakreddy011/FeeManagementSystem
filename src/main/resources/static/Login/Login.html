<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PayMyFee</title>
    <meta name="description" content="Sign in to your PayMyFee account to manage fee payments securely.">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<!-- Minimal nav for login -->
<nav class="navbar">
    <a class="logo" href="/">
        <span class="logo-icon">₹</span>
        <span>PayMyFee</span>
    </a>
    <a class="nav-login" href="/">← Back to Home</a>
</nav>

<!-- Login Page -->
<div class="login-page">
    <div class="login-card">

        <div class="logo" style="justify-content:center; margin-bottom:28px;">
            <span class="logo-icon">₹</span>
            <span>PayMyFee</span>
        </div>

        <h2>Welcome back</h2>
        <p class="login-subtitle">Sign in to manage your fee payments</p>

        <div class="login-error" id="loginError">
            ⚠️ Invalid credentials. Please try again.
        </div>

        <form class="login-form" id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-btn" id="loginSubmitBtn">
                Sign In →
            </button>
        </form>

        <div class="login-footer">
            <a href="/">← Return to landing page</a>
        </div>

    </div>
</div>

<script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        submitBtn.innerHTML = '<span class="spinner"></span>Signing in…';
        submitBtn.disabled = true;

        // Use HTTP Basic Auth — encode credentials
        const credentials = btoa(`${email}:${password}`);

        try {
            // Verify credentials with Spring Security auth endpoint
            const res = await fetch('/api/auth/login', {
                method: 'GET',
                headers: {
                    'Authorization': `Basic ${credentials}`
                }
            });

            if (res.status === 401 || res.status === 403) {
                errorBox.classList.add('visible');
                submitBtn.innerHTML = 'Sign In →';
                submitBtn.disabled = false;
                return;
            }

            const data = await res.json().catch(() => ({}));

            // Store credentials and roles in sessionStorage
            sessionStorage.setItem('fms_credentials', credentials);
            sessionStorage.setItem('fms_email', data.username || email);
            if (data.roles) {
                sessionStorage.setItem('fms_roles', JSON.stringify(data.roles));
            }

            // Redirect to dashboard
            window.location.href = '/dashboard.html';

        } catch (err) {
            errorBox.textContent = '⚠️ Could not reach server. Please check your connection.';
            errorBox.classList.add('visible');
            submitBtn.innerHTML = 'Sign In →';
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>

# Application Name
# spring.application.name=demo
# Server Port
server.port=8080
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
# Connection details from your MySQL Workbench





# Cloud database
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/paymyfee?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.user.name=user
spring.security.user.password=pwd
# You can change the username and password by providing a spring.security.user.name and spring.security.user.password
